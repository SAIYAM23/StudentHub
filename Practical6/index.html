<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Practical 6</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>StudentHub</h1>
        <p>Fetch API, JSON, Search and Filter</p>
    </header>

    <main>
        <section class="controls">
            <div class="form-group">
                <label for="dataType">Select Data</label>
                <select id="dataType">
                    <option value="events.json">Events</option>
                    <option value="students.json">Students</option>
                    <option value="faqs.json">FAQs</option>
                </select>
            </div>

            <div class="form-group">
                <label for="searchInput">Search</label>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search records..."
                >
            </div>

            <div class="form-group">
                <label for="categoryFilter">Filter by Category</label>
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sortBy">Sort By</label>
                <select id="sortBy">
                    <option value="default">Default Order</option>
                    <option value="asc">Name / Title (A–Z)</option>
                    <option value="desc">Name / Title (Z–A)</option>
                </select>
            </div>
        </section>

        <section class="results">
            <h2 id="sectionTitle">Events</h2>
            <p id="statusMessage" role="status" aria-live="polite">
                Loading data...
            </p>
            <div id="recordContainer" class="record-container"></div>
        </section>

        <nav class="pagination" aria-label="Pagination">
            <button id="prevButton" type="button">Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextButton" type="button">Next</button>
        </nav>
    </main>

    <footer>
        <p>StudentHub | Web Development Frameworks</p>
    </footer>
</body>
</html>
