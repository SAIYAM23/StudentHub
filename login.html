<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Login</title>
    <link rel="stylesheet" href="Styles/common.css">
    <link rel="stylesheet" href="Styles/login.css">
</head>
<body>

    <!-- Header Starts -->
    <header>
        <div id="logo">
            <h1>StudentHub</h1>
            <p>Your Digital Campus Companion</p>
        </div>
        <div id="header-buttons">
            <button type="button" id="theme-toggle" class="button theme-toggle" aria-pressed="false">🌙 Dark mode</button>
        </div>
    </header>
    <!-- Header Ends -->

    <!-- Navigation Starts -->
    <nav aria-label="Main Navigation">
        <button id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">☰ Menu</button>
        <ul id="main-nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html" class="active" aria-current="page">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
    <!-- Navigation Ends -->

    <!-- Main Content Starts -->
    <main>
        <section id="login-box" aria-labelledby="login-heading">
            <h2 id="login-heading">Student Login</h2>

            <form action="dashboard.html" method="post">
                <div>
                    <label for="idEmail">Email:</label>
                    <input type="email" id="idEmail" name="email" placeholder="Enter Email" required>
                </div>

                <div>
                    <label for="pass">Password:</label>
                    <input type="password" id="pass" name="password" placeholder="Enter Password" required>
                </div>

                <div>
                    <input type="submit" id="submitbtn" value="Login" class="button">
                    <a href="register.html" class="button">Register</a>
                </div>
            </form>

            <p class="admin-link">
                <strong>Demo Admin:</strong>
                Open <a href="adminDashboard.html">Admin Dashboard</a>
            </p>
        </section>
    </main>
    <!-- Main Content Ends -->

    <!-- Footer Starts -->
    <footer>
        <h2>StudentHub</h2>
        <p>Your Digital Campus Companion</p>
        <p>
            Email:
            <a href="mailto:studenthub@college.edu">studenthub@college.edu</a>
        </p>
        <p>&copy; 2026 StudentHub. All Rights Reserved.</p>
    </footer>
    <!-- Footer Ends -->

    <script src="Scripts/practical4.js" defer></script>
</body>
</html>
